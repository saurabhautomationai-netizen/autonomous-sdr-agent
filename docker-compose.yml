services:
  api:
    build: .
    image: autonomous-sdr-agent:assessment
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    image: autonomous-sdr-agent:assessment
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
